<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEBGIS Persebaran SMA Kabupaten Pringsewu</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
}

/* =========================
   LAYOUT
========================= */

.container{
    display:flex;
    width:100%;
    height:100vh;
}

.sidebar{
    width:320px;
    background:#6B1F1F;
    color:#F5E6D3;
    padding:20px;
    overflow-y:auto;
    box-shadow:2px 0 15px rgba(0,0,0,.2);
}

.sidebar h1{
    text-align:center;
    font-size:22px;
    margin-bottom:5px;
}

.sidebar p{
    text-align:center;
    font-size:14px;
    margin-bottom:15px;
}

.sidebar hr{
    border:none;
    border-top:1px solid rgba(255,255,255,.2);
    margin-bottom:15px;
}

#searchSekolah{
    width:100%;
    padding:12px 15px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    outline:none;
}

#jumlahSekolah{
    margin-bottom:15px;
    font-size:14px;
}

#daftarSekolah{
    max-height:70vh;
    overflow-y:auto;
}

.school-item{
    background:rgba(255,255,255,.08);
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
    transition:.3s;
}

.school-item:hover{
    background:rgba(255,255,255,.2);
}

#map{
    flex:1;
    height:100vh;
}

/* =========================
   MARKER
========================= */

.custom-marker{
    width:22px;
    height:22px;
    background:#6B1F1F;
    border:2px solid white;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 0 8px rgba(0,0,0,.3);
}

.custom-marker::after{
    content:'';
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:5px;
    left:5px;
}

.active-marker{
    width:30px;
    height:30px;
    background:#F59E0B;
    border:3px solid white;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 0 12px rgba(0,0,0,.4);
}

.active-marker::after{
    content:'';
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:7px;
    left:7px;
}

.legend{
    background:white;
    padding:10px;
    border-radius:10px;
    line-height:1.7;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:300px;
    }

    #map{
        height:calc(100vh - 300px);
    }

}

</style>

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h1>WEBGIS SMA</h1>

        <p>Kabupaten Pringsewu</p>

        <hr>

        <input
        type="text"
        id="searchSekolah"
        placeholder="🔍 Cari sekolah...">

        <div id="jumlahSekolah">
            Total SMA : 0
        </div>

        <div id="daftarSekolah"></div>

    </aside>

    <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let sekolahData = [];

const map = L.map('map').setView(
    [-5.43,105.26],
    12
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

let polygonLayer;
let sekolahLayer;

/* =========================
   CUSTOM ICON
========================= */

const schoolIcon = L.divIcon({
    className:'',
    html:'<div class="custom-marker"></div>',
    iconSize:[22,22],
    iconAnchor:[11,22],
    popupAnchor:[0,-20]
});

const activeIcon = L.divIcon({
    className:'',
    html:'<div class="active-marker"></div>',
    iconSize:[30,30],
    iconAnchor:[15,30],
    popupAnchor:[0,-25]
});

/* =========================
   POLYGON ADMINISTRASI
========================= */

fetch('adm psw geojson new.geojson')

.then(response => response.json())

.then(data => {

    polygonLayer = L.geoJSON(data,{

        style:{
            color:'#2563EB',
            weight:2,
            fillColor:'#60A5FA',
            fillOpacity:0.15
        },

        onEachFeature:function(feature,layer){

            layer.bindPopup(
                "<b>Wilayah :</b> " +
                (feature.properties.nama || "Pringsewu")
            );

            layer.on({

                mouseover:function(e){

                    e.target.setStyle({
                        fillOpacity:0.4,
                        weight:3
                    });

                },

                mouseout:function(e){

                    polygonLayer.resetStyle(
                        e.target
                    );

                }

            });

        }

    }).addTo(map);

    polygonLayer.eachLayer(layer=>{
        layer.bringToBack();
    });

    map.fitBounds(
        polygonLayer.getBounds()
    );

})

.catch(error=>{

    console.log(
        "Error Polygon:",
        error
    );

});

/* =========================
   TITIK SMA
========================= */

fetch('data SMA psw geojson new.geojson')

.then(response=>response.json())

.then(data=>{

    sekolahLayer = L.geoJSON(data,{

        pointToLayer:function(feature,latlng){

            return L.marker(latlng,{
                icon:schoolIcon
            });

        },

        onEachFeature:function(feature,layer){

            const nama =
            feature.properties[
            "Pendidikan Satuan SMA"
            ];

            const bujur =
            feature.geometry.coordinates[0];

            const lintang =
            feature.geometry.coordinates[1];

            layer.bindPopup(`

                <div style="min-width:220px">

                    <h3 style="
                    color:#6B1F1F;
                    margin-bottom:8px;
                    ">
                    🏫 ${nama}
                    </h3>

                    <hr>

                    <p>
                    <b>Lintang :</b>
                    ${lintang.toFixed(6)}
                    </p>

                    <p>
                    <b>Bujur :</b>
                    ${bujur.toFixed(6)}
                    </p>

                </div>

            `);

            sekolahData.push({

                nama:nama,
                layer:layer

            });

        }

    }).addTo(map);

    sekolahLayer.eachLayer(layer=>{
        layer.bringToFront();
    });

    renderSekolah(sekolahData);

    document.getElementById(
        "jumlahSekolah"
    ).innerHTML =
    "Total SMA : " +
    sekolahData.length;

})

.catch(error=>{

    console.log(
        "Error Sekolah:",
        error
    );

});

/* =========================
   DAFTAR SEKOLAH
========================= */

function renderSekolah(data){

    const daftar =
    document.getElementById(
        "daftarSekolah"
    );

    daftar.innerHTML="";

    data.forEach(item=>{

        const div =
        document.createElement(
            "div"
        );

        div.className =
        "school-item";

        div.innerHTML =
        item.nama;

        div.onclick=()=>{

            sekolahData.forEach(item2=>{

                item2.layer.setIcon(
                    schoolIcon
                );

            });

            item.layer.setIcon(
                activeIcon
            );

            const latlng =
            item.layer.getLatLng();

            map.flyTo(
                latlng,
                18,
                {
                    duration:2
                }
            );

            item.layer.openPopup();

        };

        daftar.appendChild(div);

    });

}

/* =========================
   SEARCH
========================= */

document
.getElementById(
"searchSekolah"
)

.addEventListener(
"keyup",

function(){

    const keyword =
    this.value.toLowerCase();

    const hasil =
    sekolahData.filter(
    item=>

    item.nama
    .toLowerCase()
    .includes(keyword)

    );

    renderSekolah(hasil);

});

/* =========================
   LEGENDA
========================= */

const legend =
L.control({
position:'bottomright'
});

legend.onAdd=function(){

    const div =
    L.DomUtil.create(
        'div',
        'legend'
    );

    div.innerHTML=`

        <b>Legenda</b><br>

        📍 Lokasi SMA<br>

        🟦 Batas Administrasi

    `;

    return div;

};

legend.addTo(map);

/* =========================
   SKALA
========================= */

L.control.scale({
metric:true
}).addTo(map);

</script>

</body>
</html>
